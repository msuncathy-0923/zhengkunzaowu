<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="正鲲造物产品图录">
  <title>正鲲造物产品图录</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9e8e4; color: #1d1d1b; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .8rem max(1rem, calc((100% - 960px) / 2)); background: rgba(255,255,255,.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,.08); }
    h1 { margin: 0; font-size: clamp(1rem, 2.4vw, 1.25rem); font-weight: 500; letter-spacing: .08em; }
    .counter { font-size: .82rem; color: #666; white-space: nowrap; }
    main { width: min(100%, 900px); margin: 0 auto; padding: 1.25rem 0 2.5rem; }
    figure { margin: 0 0 1.25rem; background: white; box-shadow: 0 4px 24px rgba(0,0,0,.12); }
    img { display: block; width: 100%; height: auto; }
    @media (max-width: 920px) { main { padding-top: 0; } figure { margin-bottom: .75rem; box-shadow: none; } }
    @media print { body { background: white; } header { display: none; } main { width: 100%; padding: 0; } figure { break-after: page; margin: 0; box-shadow: none; } }
  </style>
</head>
<body>
  <header>
    <h1>正鲲造物 · 产品图录</h1>
    <span class="counter" id="counter">1 / 10</span>
  </header>
  <main>
    <figure><img src="images/page-01.jpg" alt="正鲲造物产品图录，第 1 页" fetchpriority="high"></figure>
    <figure><img src="images/page-02.jpg" alt="正鲲造物产品图录，第 2 页" loading="lazy"></figure>
    <figure><img src="images/page-03.jpg" alt="正鲲造物产品图录，第 3 页" loading="lazy"></figure>
    <figure><img src="images/page-04.jpg" alt="正鲲造物产品图录，第 4 页" loading="lazy"></figure>
    <figure><img src="images/page-05.jpg" alt="正鲲造物产品图录，第 5 页" loading="lazy"></figure>
    <figure><img src="images/page-06.jpg" alt="正鲲造物产品图录，第 6 页" loading="lazy"></figure>
    <figure><img src="images/page-07.jpg" alt="正鲲造物产品图录，第 7 页" loading="lazy"></figure>
    <figure><img src="images/page-08.jpg" alt="正鲲造物产品图录，第 8 页" loading="lazy"></figure>
    <figure><img src="images/page-09.jpg" alt="正鲲造物产品图录，第 9 页" loading="lazy"></figure>
    <figure><img src="images/page-10.jpg" alt="正鲲造物产品图录，第 10 页" loading="lazy"></figure>
  </main>
  <script>
    const pages = [...document.querySelectorAll('figure')];
    const counter = document.getElementById('counter');
    new IntersectionObserver((entries) => {
      const visible = entries.filter(entry => entry.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (visible) counter.textContent = `${pages.indexOf(visible.target) + 1} / ${pages.length}`;
    }, { threshold: [.55] }).observe(pages[0]);
    pages.slice(1).forEach(page => new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) counter.textContent = `${pages.indexOf(page) + 1} / ${pages.length}`;
    }, { threshold: [.55] }).observe(page));
  </script>
</body>
</html>
